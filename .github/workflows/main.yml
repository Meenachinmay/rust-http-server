name: Main Branch CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

env:
  PROJECT_ID: rusty-lamb
  SERVICE_NAME: rusty-lamb
  REGISTRY_REGION: asia-northeast1
  ARTIFACT_REGISTRY: rusty-lamb
  RUST_VERSION: '1.85.0'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libpq-dev pkg-config

      - name: Create mux.pem file
        run: |
          echo "${{ secrets.MUX_PEM_CONTENT }}" > mux.pem
          chmod 600 mux.pem

      - name: Create .env file
        run: |
          echo "DATABASE_URL_TEST=postgresql://postgres:password@localhost:5432/rust" > .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" >> .env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
          echo "SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}" >> .env
          echo "MUX_TOKEN_ID=${{ secrets.MUX_TOKEN_ID }}" >> .env
          echo "MUX_TOKEN_SECRET=${{ secrets.MUX_TOKEN_SECRET }}" >> .env
          echo "MUX_SIGNING_KEY_ID=${{ secrets.MUX_SIGNING_KEY_ID }}" >> .env
          echo "MUX_SIGNING_KEY_SECRET=${{ secrets.MUX_SIGNING_KEY_SECRET }}" >> .env

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Set up database schema
        run: |
          sqlx database create --database-url postgresql://postgres:password@localhost:5432/rust
          sqlx migrate run --database-url postgresql://postgres:password@localhost:5432/rust

      - name: Run tests
        run: cargo test
        env:
          DATABASE_URL_TEST: postgresql://postgres:password@localhost:5432/rust

      # Build but don't deploy - just for verification
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
        if: github.event_name != 'pull_request'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        if: github.event_name != 'pull_request'

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY_REGION }}-docker.pkg.dev
        if: github.event_name != 'pull_request'

      - name: Build and tag Docker image
        run: |
          docker build -t ${{ env.REGISTRY_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
        if: github.event_name != 'pull_request'