name: CI/CD Pipeline for GCP Deployment

# Define when this pipeline should run
on:
  push:
    branches: [ dev ]

env:
  RUST_VERSION: '1.85.0'            # Latest stable Rust version

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libpq-dev pkg-config

      - name: Create .env file
        run: |
          echo "DATABASE_URL_TEST=postgresql://postgres:password@localhost:5432/rust" > .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
          echo "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" >> .env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
          echo "SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}" >> .env
          echo "Created .env file with necessary configurations"

      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Set up database schema
        run: |
          sqlx database create --database-url postgresql://postgres:password@localhost:5432/rust
          sqlx migrate run --database-url postgresql://postgres:password@localhost:5432/rust

      - name: Run tests
        run: cargo test
        env:
          DATABASE_URL_TEST: postgresql://postgres:password@localhost:5432/rust