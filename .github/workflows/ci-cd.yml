name: CI/CD Pipeline

# Define when this pipeline should run
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

# Environment variables available to all jobs
env:
  DOCKER_IMAGE: startup2023/rust-auth-server  # Updated image name for your Rust project
  RUST_VERSION: '1.85.0'  # Latest stable Rust version

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Rust environment
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          profile: minimal
          override: true
          components: rustfmt, clippy

      # Step 3: Cache dependencies to speed up workflow
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Step 4: Install additional dependencies if needed
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libpq-dev pkg-config

      # Step 5: Create temporary .env file for testing
      - name: Create .env file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
          echo "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" >> .env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL || 'http://localhost:3000' }}" >> .env
          echo "SENDER_EMAIL=${{ secrets.SENDER_EMAIL || 'chinmeiananda896@gmail.com' }}" >> .env
          echo "Created .env file with necessary configurations"

      # Step 6: Install SQLx CLI for database operations
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --no-default-features --features postgres

      # Step 7: Check formatting
#      - name: Check code formatting
#        run: cargo fmt -- --check

      # Step 8: Run clippy for linting
#      - name: Clippy
#        run: cargo clippy -- -D warnings

      # Step 9: Run tests
      - name: Run tests
        run: cargo test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'http://localhost:3000' }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL || 'chinmeiananda896@gmail.com' }}

      # Step 10: Set up Docker Buildx
      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v2

      # Step 11: Login to DockerHub
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 12: Build and push Docker image
      - name: Build and Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max