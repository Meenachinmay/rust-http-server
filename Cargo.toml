[package]
name = "first-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "first-backend"
path = "src/main.rs"

[dependencies]
actix-web = "4.4.0"
tokio = { version = "1.32.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "bigdecimal", "uuid", "chrono", "macros"] }
dotenv = "0.15"
uuid = { version = "1.4", features = ["serde", "v4"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
jsonwebtoken = "9.3.1"
futures = "0.3.31"
argon2 = "0.5.3"
lettre = "0.11.13"
sendgrid = "0.23.0"
reqwest = "0.12.12"
tokio-test = "0.4.4"
mockall = "0.13.1"
test-log = "0.2.17"
actix-cors = "0.6.4"
http = "0.2"
migrations = { git = "https://github.com/Meenachinmay/migrations.git"}
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.3", features = ["serde"] }
base64 = "0.13.1"