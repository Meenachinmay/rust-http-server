version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SENDER_EMAIL=${SENDER_EMAIL:-chinmeiananda896@gmail.com}
    restart: unless-stopped